<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <body>
    <input
      id="text"
      type="text"
      oninput="echoText()"
    />
    <p id="output"></p>

    <script>
      function echoText() {
        // input
        const inputVal = document.getElementById("text").value;

        // Output
        const output = document.getElementById("output");

        output.textContent = inputVal;
      }
    </script>
  </body>
</html>
